name: MAX Android test APK
on:
  workflow_dispatch:
  push:
    branches: [max-jarvis-test]
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: SDK versions
        run: flutter --version
      - name: Restore dependencies
        run: flutter pub get
      - name: Static analysis
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: Run existing Flutter tests
        shell: bash
        run: |
          if find test -name '*_test.dart' -type f 2>/dev/null | grep -q .; then
            flutter test
          else
            echo "::warning::No Flutter tests found; device functionality remains unverified."
          fi
      - name: Build separate test APK
        run: flutter build apk --debug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MAX-Android-test-APK
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
