name: JARVIS TR APK
on:
  push:
    branches: [turkce]
  workflow_dispatch:
concurrency:
  group: jarvis-tr-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter --version
      - run: flutter pub get
      - run: flutter build apk --release
      - run: cp build/app/outputs/flutter-apk/app-release.apk JARVIS-TR.apk
      - uses: actions/upload-artifact@v4
        with:
          name: JARVIS-TR-APK
          path: JARVIS-TR.apk
          if-no-files-found: error
