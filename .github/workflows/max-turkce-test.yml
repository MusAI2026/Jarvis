name: MAX Turkish test APK
on:
  push:
    branches: [max-turkce-ses-test]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Check SDK and restore dependencies
        run: |
          flutter --version
          flutter pub get
      - name: Restore missing Gradle wrapper files
        run: |
          if [ ! -f android/gradlew ] || [ ! -f android/gradle/wrapper/gradle-wrapper.jar ]; then
            flutter create --platforms=android --project-name max_wrapper /tmp/max_wrapper
            cp /tmp/max_wrapper/android/gradlew android/gradlew
            cp /tmp/max_wrapper/android/gradle/wrapper/gradle-wrapper.jar android/gradle/wrapper/gradle-wrapper.jar
          fi
          chmod +x android/gradlew
      - name: Turkish voice regression tests
        run: flutter test test/max_turkce_ses_test.dart
      - name: Existing regression suite
        run: flutter test
      - name: Build isolated test APK
        run: flutter build apk --debug
      - uses: actions/upload-artifact@v4
        with:
          name: MAX-Turkce-Test-APK
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14
